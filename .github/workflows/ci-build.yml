name: CI — Build & Push

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "Dockerfile"

jobs:
  build-and-push:
    name: Build multi-arch image & update manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT para poder hacer push de vuelta a los manifests
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # ── 2. QEMU (emulación ARM para el RPi3) ──────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Buildx ─────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Login GHCR ─────────────────────────────────────────────────────
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Build & Push ───────────────────────────────────────────────────
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/k3sapp:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/k3sapp:latest
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── 6. Actualizar tags en los manifests ───────────────────────────────
      - name: Update image tags in k8s manifests
        run: |
          NEW_TAG="ghcr.io/${{ github.repository_owner }}/k3sapp:${{ github.sha }}"
          echo "Actualizando imagen → $NEW_TAG"

          # Reemplazar en todos los deployments
          for f in k8s/traffic-processor-r3.yaml k8s/traffic-processor-vm1.yaml k8s/camera-simulator.yaml; do
            sed -i "s|image: ghcr.io/.*/k3sapp:.*|image: $NEW_TAG|g" "$f"
          done

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/
          git diff --staged --quiet \
            || git commit -m "ci: update image to ${{ github.sha }} [skip ci]"
          git push
