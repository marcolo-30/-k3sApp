apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-processor
  namespace: smartcity
  labels:
    app: traffic-processor
    version: r3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-processor
  template:
    metadata:
      labels:
        app: traffic-processor
        version: r3
    spec:
      nodeSelector:
        kubernetes.io/hostname: r3-node

      containers:
        - name: traffic-processor
          image: ghcr.io/marcolo-30/k3sapp:10f4b655a267d19ef97479c6f551f3f8e62b6333
          command: ["python", "traffic_processor.py"]
          ports:
            - containerPort: 8080

          env:
            - name: SERVICE_NAME
              value: "traffic-processor-r3"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4318"
            # Latencia lineal: 800ms=1.0 | 1445ms=0.0  (en practica 1316ms~0.20)
            - name: QOS_LATENCY_NORMAL_S
              value: "0.8"
            - name: QOS_LATENCY_CRITICAL_S
              value: "1.445"
            - name: QOS_THROUGHPUT_BASELINE
              value: "2.0"
            - name: QOS_WINDOW_SECONDS
              value: "30"
            - name: SERVER_PIPELINE_REPEATS
              value: "5"
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORT_INTERVAL_MS
              value: "5000"
            - name: QOS_CPU_NORMAL
              value: "50"
            - name: QOS_CPU_CRITICAL
              value: "80"
            # Memoria desde Prometheus: 64%=1.0 | 68%=0.70 | 72%=0.0
            - name: QOS_MEM_NORMAL_PCT
              value: "64"
            - name: QOS_MEM_CRITICAL_PCT
              value: "72"
            - name: PROMETHEUS_URL
              value: "http://192.168.0.42:9090"
            - name: K8S_NODE_NAME
              value: "r3-node"

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 18
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
