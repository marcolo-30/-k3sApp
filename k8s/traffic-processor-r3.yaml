apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-processor
  namespace: smartcity
  labels:
    app: traffic-processor
    version: r3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-processor
  template:
    metadata:
      labels:
        app: traffic-processor
        version: r3
    spec:
      nodeSelector:
        kubernetes.io/hostname: r3-node

      containers:
        - name: traffic-processor
          image: ghcr.io/marcolo-30/k3sapp:857455604bd479ee2f31556861015f2c8f781a68
          command: ["python", "traffic_processor.py"]
          ports:
            - containerPort: 8080

          env:
            - name: SERVICE_NAME
              value: "traffic-processor-r3"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability:4318"
            - name: QOS_LATENCY_BASELINE
              value: "0.3"
            - name: QOS_THROUGHPUT_BASELINE
              value: "2.0"
            - name: QOS_WINDOW_SECONDS
              value: "30"
            - name: SERVER_PIPELINE_REPEATS
              value: "5"
            - name: PORT
              value: "8080"
            - name: OTEL_EXPORT_INTERVAL_MS
              value: "5000"
            # CPU score: 1.0 hasta 50%, cae a 0.0 en 80% → migrar
            - name: QOS_CPU_NORMAL
              value: "50"
            - name: QOS_CPU_CRITICAL
              value: "80"
            # Memoria nodo (total-free): normal 500-530MB, crítico 611MB
            - name: QOS_MEM_NORMAL_MB
              value: "530"
            - name: QOS_MEM_CRITICAL_MB
              value: "611"

          # startupProbe: da 90s para que arranque PIL+uvicorn en RPi3
          # Solo cuando pasa, k8s activa liveness y readiness.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 18    # 18 * 5s = 90s máximo para arrancar
            periodSeconds: 5
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu:    "200m"
              memory: "256Mi"
            limits:
              # 512Mi suficiente sin numpy (PIL+FastAPI+OTEL ≈ 150-200MB)
              memory: "512Mi"
              # Sin límite de CPU para que el benchmark sea realista
